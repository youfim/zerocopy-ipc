name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind scikit-build-core numpy pytest

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON -DBUILD_PYTHON_BINDINGS=OFF

      - name: Build C++ core and unit tests
        run: |
          cmake --build build --config Release

      - name: Run C++ unit tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Install zero_copy_ipc in editable mode
        run: |
          pip install -e . --no-build-isolation

      - name: Run Python unit tests
        run: |
          python -m pytest tests/test_python_api.py -v
